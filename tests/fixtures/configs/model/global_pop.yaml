name: global_pop
family: baseline
implementation: adrec_still.models.baselines.popularity.GlobalPop
# train_targets: next-POI frequency over completed training gaps, counted once per
#   gap at the query_s_sec=0 landmark.
# poi_catalog: training check-in frequency from poi_catalog.parquet train_count.
count_source: train_targets
# Additive smoothing keeps unseen train-catalog POIs at a finite log-probability.
smoothing: 1.0
