name: adrec_h
family: adrec

# Data-free tensor-core defaults (Issue #27). The vocabulary is a small dense synthetic
# catalog with id 0 reserved for padding; this is NOT a scalable scheme for Gowalla's
# 991,787-POI training catalog. Canonical integration must consume the accepted sampled or
# in-batch loss contract (Issues #12/#13/#15) before any reportable Gowalla run.
num_items: 64
embedding_dim: 64
num_history_layers: 2
num_denoiser_layers: 2
# num_heads / feedforward_dim / embedding_dropout mirror the pinned upstream block
# conventions (common.py hard-codes 4 heads and the 4x FFN width; model.py applies
# emb_dropout 0.3 then LayerNorm eps 1e-12 to history embeddings only).
num_heads: 4
feedforward_dim: 256
dropout: 0.1
embedding_dropout: 0.3
max_sequence_length: 50
diffusion_steps: 32
# truncated_linear reproduces the pinned upstream default `noise_schedule: trunc_lin`
# (Nemo-1024/ADRec @ 0a30ef7, src/step_sample.py + src/config.yaml, diffusion_steps: 32):
# terminal alpha_bar ~= 9.9e-7, so predict_next's pure-noise start satisfies the
# near-pure-noise policy (<= 1e-2). The previous `linear` default (Ho et al., unscaled)
# kept terminal alpha_bar ~= 0.72 at 32 steps and is now refused for pure-noise inference.
noise_schedule: truncated_linear
# fusion_lambda reproduces upstream lambda_uncertainty (verified same fusion equation
# z_i = c_i + lambda * (x_t_i + e(t_i))); rescale_timesteps reproduces upstream
# _scale_timesteps (the sinusoidal embedding input is t * 1000 / diffusion_steps, while
# schedule indexing keeps the raw integer t). Both verified at the pinned commit.
fusion_lambda: 0.001
mse_weight: 1.0
rescale_timesteps: true
seed: 41
