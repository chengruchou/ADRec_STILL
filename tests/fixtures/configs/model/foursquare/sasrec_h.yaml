# Foursquare city counterpart of configs/model/sasrec_h.yaml (#69), shared by NYC and TKY.
# Identical to it except formal_recipe.specification_id: the Foursquare cities execute
# under still-foursquare-core-v1-20260910, which carries Gowalla's training, evaluation
# and selection values but is a separate, proposed specification. Comments below that
# name the Gowalla specification describe where those values were decided.
#
name: sasrec_h
family: baseline
implementation: adrec_still.models.baselines.sasrec.SASRecH
# History-only self-attention baseline (B2.2): the model reads history_poi/
# history_mask only. query_s_sec is never consumed, so predictions are identical
# for every landmark of the same gap by construction. The item embedding table,
# the tied full-catalog output and the sampled-candidate policy are exactly
# GRU4Rec-H's, so the history encoder is the only intended difference. The
# exported context contract is docs/SASREC_H_CONTEXT_CONTRACT.md.
#
# Training block: the frozen research specification still-gowalla-core-v1-20260909
# (#37, closed 2026-09-09); consumed by the shared trainer and diagnosed in every
# run record. The three #40 arms must keep this block identical
# (tests/models/baselines/test_sasrec_time_controls.py). Formal Table 1 cells
# additionally need the registered #38 24h selection manifest bound to the run.
embedding_dim: 128
# Point-wise feed-forward inner width. The attention/context width is
# embedding_dim, which keeps the tied output projection-free.
hidden_dim: 128
num_layers: 2
num_heads: 2
dropout: 0.2
# Must be at least the evaluation max_sequence_length: positions are indexed by
# recency distance, and a longer collated history is refused rather than clamped.
max_sequence_length: 100
training:
  # Shared Issue #13 weight tensor; primary contract is per_gap, the
  # per_landmark setting is the registered sensitivity axis outside the core.
  landmark_weighting: per_gap
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  amsgrad: false
  scheduler: null
  gradient_clipping: null
  amp: false
  tf32: false
  gradient_accumulation: 1
  drop_last: false
  batch_size: 256
  max_epochs: 20
  early_stopping_patience: 5
  min_delta: 0.0
  # Table 1 selection: validation NDCG@10, max, on the complete natural 24h
  # validation risk set (no batch prefix).
  early_stopping_metric: ndcg@10
  early_stopping_mode: max
  selection_horizon_sec: 86400
  validation_max_batches: null
  # 128 uniform known-catalog negatives per eligible row (shared builder).
  # Evaluation always scores the full catalog exactly through the shared evaluator.
  negative_samples: 128
  device: auto
formal_recipe:
  specification_id: still-foursquare-core-v1-20260910
  table: table1
  training_profile: observed-known-v0-proposed
  weighting_contract: still-landmark-weighting-v0.1
  selection:
    metric: ndcg@10
    direction: max
    horizon_sec: 86400
