name: foursquare_tky_first_order_markov
description: Training-only last-POI transition baseline on the Foursquare TKY v0.1 protocol (#69).
dataset_config: configs/dataset/foursquare_tky.yaml
model_config: configs/model/first_order_markov.yaml
manifest: data/manifests/foursquare_tky_v0.1.json
# Deterministic, so one recorded seed is sufficient; the seed is still written into
# every run record.
seeds: [41]
evaluation:
  splits: [validation, test]
  batch_size: 128
  max_sequence_length: 100
  num_workers: 0
output_dir: results/baselines/foursquare_tky_first_order_markov
