name: gowalla_still_joint
description: >-
  Coherent joint arm (#41) on the frozen Gowalla v0.1 protocol under the frozen
  research specification still-gowalla-core-v1-20260909 (#37, closed 2026-09-09),
  including the registered same-checkpoint fixed_pi_truncated ablation. The #39
  still-train-admin-censor-v1 contract is implemented and accepted
  (still.common.acceptance), and this cell executes it. The execution config is
  declared frozen; every invocation independently requires clean source, the frozen
  canonical bytes, an available explicit cuda:0 device, the complete registered
  24h selection, and the shared selected-checkpoint reload/export path. The
  declaration does not certify any run or empirical result.
specification_id: still-gowalla-core-v1-20260909
specification_status: frozen
frozen: true
dataset_config: configs/dataset/gowalla.yaml
model_config: configs/model/still_joint.yaml
manifest: data/manifests/gowalla_v0.1.json
# Registered #38 selection manifest for this cell (table2, complete 24h
# validation population), derived by scripts/register_gowalla_selection.py from
# the frozen Gowalla v0.1 Parquet and independently re-derived from source
# (#41). Naming it is not acceptance: the still runner re-derives a register_selection
# identity from this run's own artifacts and only an exact match promotes the binding
# to bound (#63). Until that derivation runs the cell keeps a formal blocker.
seeds: [41, 42, 43]
device: cuda:0
evaluation:
  splits: [validation, test]
  batch_size: 128
  max_sequence_length: 100
  num_workers: 0
output_dir: results/raw/still/gowalla_still_joint
