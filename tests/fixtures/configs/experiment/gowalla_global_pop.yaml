name: gowalla_global_pop
description: Non-personalized next-POI frequency floor on the frozen Gowalla v0.1 protocol.
dataset_config: configs/dataset/gowalla.yaml
model_config: configs/model/global_pop.yaml
manifest: data/manifests/gowalla_v0.1.json
# GlobalPop is deterministic, so one recorded seed is sufficient; the seed is
# still written into every run record. The fixed [41, 42, 43] sweep applies to
# the trainable B1/B2 models.
seeds: [41]
evaluation:
  splits: [validation, test]
  # Full-catalog scoring materializes [batch, number_of_pois] float32 tensors.
  # At ~1e6 training POIs, batch_size 128 peaks near 1.5 GB of host memory.
  batch_size: 128
  max_sequence_length: 100
  num_workers: 0
output_dir: results/baselines/gowalla_global_pop
