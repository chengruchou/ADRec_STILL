name: foursquare_tky_sasrec_clock
description: >-
  Query-clock control (#40): hour-of-day and day-of-week sin/cos only, elapsed
  masked, on the Foursquare TKY v0.1 protocol (#69).
dataset_config: configs/dataset/foursquare_tky.yaml
model_config: configs/model/foursquare/sasrec_clock.yaml
manifest: data/manifests/foursquare_tky_v0.1.json
# Proposed specification (#69): Gowalla's training, evaluation and selection values
# under a separate Foursquare ID. The formal gate refuses a proposed specification,
# so no run of this config is formal until the lead records the decision.
specification_id: still-foursquare-core-v1-20260910
specification_status: proposed
# Execution contract not accepted: frozen is declared only after the bounded fixture
# evidence (#69 PR 3), and never suffices on its own.
frozen: false
device: cuda:0
# Registered #38 selection manifest for this cell (table1, complete 24h validation
# population), derived by scripts/register_selection.py from the frozen Foursquare
# TKY v0.1 Parquet. Naming it does not bind it: every run re-derives it from its
# own artifacts before allocating a model.
seeds: [41, 42, 43]
evaluation:
  splits: [validation, test]
  batch_size: 128
  chunk_size: 4096
  max_sequence_length: 100
  num_workers: 0
output_dir: results/baselines/foursquare_tky_sasrec_clock
