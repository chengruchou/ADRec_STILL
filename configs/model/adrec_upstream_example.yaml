# Upstream ADRec reference (event-only; staged trainer).
name: adrec
hidden_size: 128
max_len: 50
dropout: 0.1
emb_dropout: 0.3
diffusion_steps: 32
noise_schedule: trunc_lin
lambda_uncertainty: 0.001
independent: true            # token-independent diffusion (the ADRec novelty)
cfg_scale: 1.0
loss_scale: 1.0
embedding_pretrain: true     # run the position-free SASRec pretrain stage
ce_chunk_tokens: 4096        # gradient-checkpointed CE chunks; null = dense upstream CE
training:
  early_stopping_metric: ndcg@10
  pretrain_epochs: 10        # each stage budget may drop to 1 for smoke runs
  warmup_epochs: 5
  max_epochs: 20             # finetune budget
  early_stopping_patience: 5
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 1.0e-5
  pcgrad: false              # true enables the fork's gradient projection
